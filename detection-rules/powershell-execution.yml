title: PowerShell Process Creation
id: 3596414f-1d20-4d21-8dfd-598a12ef1e97
status: experimental
description: Detects PowerShell or PowerShell Core process creation in Sysmon. Intended as a triage signal in this lab, not proof of malicious activity.
author: Mini SOC Lab
date: 2026-09-17
references:
    - https://learn.microsoft.com/en-us/windows/security/operating-system-security/sysmon/sysmon-events
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_sysmon:
        EventID: 1
    selection_image:
        Image|endswith:
            - '\\powershell.exe'
            - '\\pwsh.exe'
    condition: all of selection_*
fields:
    - Computer
    - User
    - Image
    - CommandLine
    - ParentImage
    - Hashes
    - ProcessGuid
falsepositives:
    - Approved administration and endpoint management automation
    - Login scripts and software deployment tools
level: medium
